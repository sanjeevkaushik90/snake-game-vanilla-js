<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link rel="stylesheet" href="output.css">
</head>

<body class="bg-gray-800">
  <main class="max-w-[1200px] mx-auto px-6">
    <div class=" border-solid border-black h-auto w-auto border-4 rounded-xl m-10">

      <!-- info -->
      <div class="text-xl font-mono font-bold text-[#e4dddd] flex justify-between pt-10">
        <h1 class="border-2 border-white px-2 py-0.5 flex justify-center items-center rounded-xl m-3">All The Best</h1>
        <h1 class="border-2 border-white px-2  flex justify-center items-center rounded-xl">Hope You Die</h1>
        <h1 class="border-2 border-white px-2 py-0.5 flex justify-center items-center rounded-xl m-3">Play for fun</h1>
      </div>

      <!-- board -->
      <div class="w-full max-w-[1000px] aspect-[4/3] border border-white mx-auto mt-2 mb-4  overflow-hidden">
        <div id="grid" class="w-full h-full grid"></div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
